{% extends "base.html" %}

{% block title %}Register a Team | GDG Open Day{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-5 sm:py-8">

    <!-- Header -->
    <div class="text-center space-y-2 mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-semibold text-amber-400">
            <span>👥</span>
            <span>Team Registration</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-white tracking-wider">
            REGISTER YOUR TEAM
        </h1>
        <p class="text-sm text-slate-400 max-w-lg mx-auto">
            Register your team and add the people taking part.
        </p>
    </div>

    <!-- Registration Card -->
    <div class="bg-google-card border border-google-border rounded-2xl p-4 sm:p-8 shadow-2xl relative">
        
        <form action="{{ url_for('register') }}" method="POST" class="space-y-6">

            <!-- Team Name -->
            <div>
                <label for="team-name" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                    Team Name <span class="text-google-red">*</span>
                </label>
                <input type="text" id="team-name" name="name" required minlength="2" maxlength="50" pattern="[\p{L}\p{N}][\p{L}\p{N} &amp;'-]{0,48}[\p{L}\p{N}]" title="Use 2-50 letters, numbers, spaces, apostrophes, hyphens, or ampersands. Start and end with a letter or number." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-google-blue">
            </div>

            <!-- Team Leader -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="captain-name" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                        Team Leader <span class="text-google-red">*</span>
                    </label>
                    <input type="text" id="captain-name" name="captain" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-google-blue">
                </div>

                <div>
                    <label for="captain-email" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                        Team Leader Email
                    </label>
                    <input type="email" id="captain-email" name="captain_email" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-google-blue">
                </div>

                <div>
                    <label for="team-color" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
                        Team Color
                    </label>
                    <select id="team-color" name="color" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-google-blue">
                        <option value="google-blue">🔵 Blue</option>
                        <option value="google-red">🔴 Red</option>
                        <option value="google-yellow">🟡 Yellow</option>
                        <option value="google-green">🟢 Green</option>
                        <option value="black-bulls-gold">⚫ Charcoal</option>
                    </select>
                </div>
            </div>

            <!-- Team Members -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-300">
                            Team Members
                        </label>
                    </div>
                    <button type="button" onclick="addMemberRow()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-google-blue flex items-center gap-1 transition">
                        <span>+</span> Add Member
                    </button>
                </div>

                <div id="members-container" class="space-y-2.5">
                    <!-- Default Member Row 1 -->
                    <div class="member-row flex flex-wrap items-center gap-2">
                        <input type="text" name="members[]" aria-label="Team member name" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
                        <input type="email" name="emails[]" aria-label="Team member email" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
                        <button type="button" onclick="removeMemberRow(this)" class="p-2 text-slate-500 hover:text-rose-400 text-xs font-bold">&times;</button>
                    </div>

                    <!-- Default Member Row 2 -->
                    <div class="member-row flex flex-wrap items-center gap-2">
                        <input type="text" name="members[]" aria-label="Team member name" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
                        <input type="email" name="emails[]" aria-label="Team member email" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
                        <button type="button" onclick="removeMemberRow(this)" class="p-2 text-slate-500 hover:text-rose-400 text-xs font-bold">&times;</button>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-4 border-t border-google-border">
                <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-google-blue via-indigo-600 to-google-green text-white font-extrabold text-sm shadow-xl shadow-blue-500/20 hover:scale-[1.01] active:scale-[0.99] transition flex items-center justify-center gap-2">
                    <span>✓</span>
                    <span>Register Team</span>
                </button>
            </div>

        </form>

    </div>

</div>

<script>
    function addMemberRow() {
        const container = document.getElementById('members-container');
        const count = container.children.length + 2;
        const div = document.createElement('div');
        div.className = 'member-row flex flex-wrap items-center gap-2 animate-in fade-in duration-200';
        div.innerHTML = `
            <input type="text" name="members[]" aria-label="Team member name" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
            <input type="email" name="emails[]" aria-label="Team member email" class="w-full min-w-0 sm:flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-google-green">
            <button type="button" onclick="removeMemberRow(this)" class="p-2 text-slate-500 hover:text-rose-400 text-xs font-bold">&times;</button>
        `;
        container.appendChild(div);
    }

    function removeMemberRow(btn) {
        btn.closest('.member-row').remove();
    }
</script>
{% endblock %}
